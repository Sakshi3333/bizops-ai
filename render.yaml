# Render Blueprint for the API. The database lives on Neon (free, no expiry) and
# the frontend on Vercel, so only the backend is defined here.
services:
  - type: web
    name: bizops-ai-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: ohio # same region as the Neon database (AWS us-east-2)
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SEED_DEMO_DATA
        value: "true"
      - key: DEMO_REFRESH_HOURS
        value: "24" # rebuild the demo company daily (on the next start) to keep dates current
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false # paste the Neon connection string
      - key: CORS_ORIGINS
        sync: false # e.g. https://bizops-ai.vercel.app
      - key: GEMINI_API_KEY
        sync: false # optional; the assistant page reports itself unavailable without it
